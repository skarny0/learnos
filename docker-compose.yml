services:
  env:
    build: ./env
    ports: ["8000:8000"]
    environment:
      LEARNOS_MODE: ${LEARNOS_MODE:-sim}      # sim | live
      LEARNOS_GRADER_TOKEN: ${LEARNOS_GRADER_TOKEN:-change-me}
      LEARNOS_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./instances:/instances:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: ./ui
    ports: ["8080:80"]
    environment:
      LEARNOS_API: http://env:8000
    depends_on:
      env:
        condition: service_healthy
