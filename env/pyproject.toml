[project]
name = "learnos-env"
version = "0.0.1"
description = "LearnOS environment service: canonical workspace state, seeded episodes, grader, traces."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyBKT>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["learnos_env*"]
