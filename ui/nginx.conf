server {
  listen 80;
  location / { root /usr/share/nginx/html; index index.html; }
  # The desktop uses page-relative URLs (ws, ui/state, live/*, docs) so the same bundle also works
  # when the env server serves it directly (Colab). /api/ is kept for scripts that use it.
  location /api/ { proxy_pass http://env:8000/; }
  location /ws { proxy_pass http://env:8000/ws; proxy_http_version 1.1;
                 proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /ui/ { proxy_pass http://env:8000/ui/; }
  location /live/ { proxy_pass http://env:8000/live/; }
  location /docs { proxy_pass http://env:8000/docs; }
  location /openapi.json { proxy_pass http://env:8000/openapi.json; }
}
