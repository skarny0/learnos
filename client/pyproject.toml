[project]
name = "learnos-client"
version = "0.0.1"
description = "smolagents tools + eval runner for the LearnOS environment"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "smolagents>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["learnos_client*"]
